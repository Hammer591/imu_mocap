%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters. Adjust them!
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"
loopClosing: 1

# Left Camera calibration and distortion parameters (OpenCV)
# Camera1.fx: 913.848388671875
# Camera1.fy: 913.6023559570312
# Camera1.cx: 642.9407348632812
# Camera1.cy: 371.1956787109375

# Camera1.fx: 614.67170934
# Camera1.fy: 617.63448453
# Camera1.cx: 326.22132726
# Camera1.cy: 245.58281905

Camera1.fx: 387.692
Camera1.fy: 387.692
Camera1.cx: 325.857
Camera1.cy: 234.901

# distortion parameters
Camera1.k1: 0.0
Camera1.k2: 0.0
Camera1.p1: 0.0
Camera1.p2: 0.0

# Camera resolution
Camera.width: 640
Camera.height: 480

# Camera frames per second
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

# Transformation from body-frame (imu) to left camera
# Per-device firmware calibration (SN 242322070462), rs-enumerate-devices -c:
#   Color->Gyro extrinsic inverted: R_cg^T, t = -R_cg^T * t_cg
#   = pose of IMU in color optical frame. Matches live TF
#   camera_color_optical_frame -> camera_imu_optical_frame [0.020, -0.005, -0.012].
IMU.T_b_c1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: f
   data: [0.999956,0.00931502,0.00110512,0.020316,
         -0.00931414,0.999956,-0.00080411,-0.005129,
         -0.00111257,0.000793782,0.999999,-0.011599,
         0.0, 0.0, 0.0, 1.0]

# Do not insert KFs when recently lost
IMU.InsertKFsWhenLost: 0

# IMU noise (Use those from VINS-mono)
IMU.NoiseGyro: 2.44e-4 #1e-3 # rad/s^0.5
IMU.NoiseAcc: 1.47e-3 #1e-2 # m/s^1.5
IMU.GyroWalk: 1e-4 # rad/s^1.5
IMU.AccWalk: 1e-3 # m/s^2.5
IMU.Frequency: 200.0

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# ORB Extractor: Number of features per image
ORBextractor.nFeatures: 2000

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
ORBextractor.nLevels: 8 # 10

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# You can lower these values if your images have low contrast
ORBextractor.iniThFAST: 15
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -3.5
Viewer.ViewpointF: 500.0

#--------------------------------------------------------------------------------------------
# Atlas Parameters
#--------------------------------------------------------------------------------------------
#
# System.SaveAtlasToFile: "ORB_SLAM3_ROS2/maps/prev_atlas"
# System.LoadAtlasFromFile: "ORB_SLAM3_ROS2/maps/prev_atlas"
